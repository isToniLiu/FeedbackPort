name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号不在这里写，读根 package.json 的 packageManager 字段，
      # 避免两处版本声明冲突（pnpm/action-setup 会直接报错拒绝启动）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r lint

      - run: pnpm -r test

      # webpack 的模块解析比 tsc/vitest（走 esbuild/rollup）严格，之前发现过
      # packages/core 里 .js 后缀的相对导入能过 typecheck/test 但过不了这个，
      # 留着这一步防止同类问题再溜回来
      - run: pnpm --filter @feedbackport/web build
